# Code du Type de contenu
doc.content.type=DOCUMENT_ASSURE
# Code du champ NSS
doc.nss.field=N_NSS
# Code du champ Numéro de demande
doc.ndem.field=N_DEM
# Code du champ Groupe de document
doc.groupetype.field=AL_ASSURE_GROUPE_DOC
# Code du champ Type de document
doc.doctype.field=AL_ASSURE_TYPE_DOC
# ID du champ Type de document
doc.groupetype.field.id=10
# Code du champ Orga (Définition sur le flux d'entrée)
doc.orga.field=ORGA
# Code du champ Date du document
doc.date.field=D_VALEUR
# Code du champ ID Gedos permettant de savoir si le document est un document de reprise GEDOS
doc.idgedos.field=IDGEDOS
# Code du champ Création du document
doc.user.create.field=U_CREAT
# Code du champ Gestionnaire actif
doc.gest.field=U_GEST
# Code du champ Nombre de pages
doc.numpages.field=NOMBRE_PAGES
# Code du champ Nom - Prénom
doc.name.field=NOM
# Code du champ Gestionnaire (Pas utilisé en GED, uniquement pour information dans Doc.Series)
doc.gestionnaires_info.field=GESTIONNAIRES
# Code du champ Gestionnaires (Utilisé pour le Workflow)
wf.gest.field=U_GESTS
# Code du champ du statut du Workflow
wf.status.field=AL_WKF_STATUT
# ID du statut Workflow "Pour transfert ou prise en compte"
wf.status.active=7
# ID du statut Workflow "Gestionnaire inconnu"
wf.status.unknown=10
# ID du statut Workflow "Archivé"
wf.status.archive=11
# Code du champ Workflow (Pas utilisé en GED, uniquement pour donner l'information au WebService)
wf.active.field=WF
# Valeur attendu pour le code wf.active.field si un flux Workflow doit être initié
wf.active.value=OUI
# Code du champ Numéro de courrier
ocr.cour.field=N_COUR
# Code du champ permettant de savoir si un document avec le numéro courrier a déjà été traité
ocr.flag.field=FLAG_OCR
# Code du champ Nom (Pas utilisé en GED, uniquement pour information dans Doc.Series)
identity.field=NAME
# Code du champ Langage (Pas utilisé en GED, uniquement pour information dans Doc.Series)
language.field=LANGUAGE

#############################################
# Options				                    #
#############################################
# Le WebService doit-il calculé le nombre de page du document (0=NON; 1=OUI)
count.page.active=1
# Définition du niveau confidentiel 600 par WebAI (0=NON; 1=OUI)
webai.confidentiel.active=1
# Définition du Nom-Prénom par WebAI (0=NON; 1=OUI)
doc.name.active=1
# Définition du niveau de secret LFA par le numéro de demande (0=NON; 1=OUI)
doc.ndem.active=1
# Si doc.ndem.active est actif alors définition de numéro de demande pour traitement
doc.ndem.3333=700
doc.ndem.9876=550
#doc.confid.folders=3333
# Si doc.ndem.active est actif alors niveau de secret défini pour les LFA
#doc.ndem.secretlevel=700
# Si doc.doctype.active est actif alors définition de le type de document pour traitement - doc.ndem.active est prioritaire (0=NON; 1=OUI)
doc.doctype.active=0
# Si doc.doctype.active est actif alors niveau de secret défini pour les LFA
doc.doctype.secretlevel=
# Définition du niveau de secret pour les documents confidentiel
doc.webai_confidentiel.secretlevel=600
# Nom de l'utilisateur Confidentiel permettant de définir Confidentiel comme gestionnaire du document afin de mettre ce document dans la corbeille Confidentiel
doc.webai_gestionnaire_login=CONFIDENTIEL
# Le WebService doit-il donné les droits en écriture sur un document envoyé par un utilisation ayant un profil lecture seul
doc.edit_for_read_profil.active=1
# Flux Workflow - Définition si un workflow d'un document confidentiel va dans la corbeille confidentiel. 
# Si non alors il va dans la corbeille du gestionnaire actif directement (0=NON; 1=OUI)
confidentiel.distribution.basket.active=1
# Flux Workflow - Si la règle de gestion retourne aucun utilisateur alors le document est archivé sinon corbeille TEMP (0=NON; 1=OUI)
ocr.archive_if_no_gest.active=0
# Vérifier dans WebAI si le numéro OCR est en attente (via requete webai.db.check)
ocr.check.active=0
# Pour la définition du Workflow OCR 
webai.db.ocr.use_ocr.active=0
ocr.return.file.path=/data/int1/journaling/ocrReturns/processing

