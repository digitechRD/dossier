webai.db.gest=SELECT aivsweb.AIDPATT.DATTUT AS GEST FROM aivsweb.AIDPATT INNER JOIN aivsweb.AIDPDEM ON (aivsweb.AIDPDEM.DDEMID = aivsweb.AIDPATT.DDEMID) INNER JOIN aivsweb.AIDPGDE ON (aivsweb.AIDPGDE.DGDEID = aivsweb.AIDPDEM.DGDEID) INNER JOIN aivsweb.AISPDOS ON (aivsweb.AISPDOS.SDOSID = aivsweb.AIDPGDE.SDOSID) INNER JOIN aivsweb.TITIERP ON (aivsweb.TITIERP.HTITIE = aivsweb.AISPDOS.SDOSAS) INNER JOIN aivsweb.TIPERSP ON (aivsweb.TIPERSP.HTITIE = aivsweb.TITIERP.HTITIE) INNER JOIN aivsweb.TIPAVSP ON (aivsweb.TIPAVSP.HTITIE = aivsweb.TITIERP.HTITIE) WHERE aivsweb.TITIERP.HTPPHY = '1' AND aivsweb.TIPAVSP.HXNAVS like '#VALUE_TO_REPLACE#%' AND aivsweb.AIDPATT.DATTAC=22002024 AND aivsweb.AIDPATT.DATTTY=22000054 ORDER BY aivsweb.AIDPATT.DATTDE DESC, aivsweb.AIDPATT.DATTID DESC fetch first 1 row only
webai.db.confidential=SELECT 'VSCONF' FROM aivsweb.AISPDOS INNER JOIN aivsweb.TITIERP ON (aivsweb.TITIERP.HTITIE = aivsweb.AISPDOS.SDOSAS) INNER JOIN aivsweb.TIPERSP ON (aivsweb.TIPERSP.HTITIE = aivsweb.TITIERP.HTITIE) INNER JOIN aivsweb.TIPAVSP ON (aivsweb.TIPAVSP.HTITIE = aivsweb.TITIERP.HTITIE) WHERE aivsweb.TITIERP.HTPPHY='1' AND aivsweb.TIPAVSP.HXNAVS like '#VALUE_TO_REPLACE#%' AND aivsweb.AISPDOS.SDOSCF = '1'
webai.db.confidential_all=SELECT aivsweb.TIPAVSP.HXNAVS FROM aivsweb.AISPDOS INNER JOIN aivsweb.TITIERP ON (aivsweb.TITIERP.HTITIE = aivsweb.AISPDOS.SDOSAS) INNER JOIN aivsweb.TIPERSP ON (aivsweb.TIPERSP.HTITIE = aivsweb.TITIERP.HTITIE) INNER JOIN aivsweb.TIPAVSP ON (aivsweb.TIPAVSP.HTITIE = aivsweb.TITIERP.HTITIE) WHERE aivsweb.TITIERP.HTPPHY='1' AND aivsweb.AISPDOS.SDOSCF = '1'
webai.db.req1=SELECT aivsweb.AIDPATT.DATTUT AS GEST FROM aivsweb.AIDPATT INNER JOIN aivsweb.AIDPDEM ON (aivsweb.AIDPDEM.DDEMID = aivsweb.AIDPATT.DDEMID) INNER JOIN aivsweb.AIDPGDE ON (aivsweb.AIDPGDE.DGDEID = aivsweb.AIDPDEM.DGDEID) INNER JOIN aivsweb.AISPDOS ON (aivsweb.AISPDOS.SDOSID = aivsweb.AIDPGDE.SDOSID) INNER JOIN aivsweb.TITIERP ON (aivsweb.TITIERP.HTITIE = aivsweb.AISPDOS.SDOSAS) INNER JOIN aivsweb.TIPERSP ON (aivsweb.TIPERSP.HTITIE = aivsweb.TITIERP.HTITIE) INNER JOIN aivsweb.TIPAVSP ON (aivsweb.TIPAVSP.HTITIE = aivsweb.TITIERP.HTITIE) WHERE aivsweb.TITIERP.HTPPHY = '1' AND aivsweb.TIPAVSP.HXNAVS like '#VALUE_TO_REPLACE#%' AND NOT EXISTS (SELECT PLIEC1 FROM aivsweb.AIPPLIE where PLIETY = 22002042 AND PLIEC1 = aivsweb.AIDPATT.DATTID) AND NOT EXISTS (SELECT PLIEC1 FROM aivsweb.AIPPLIE where PLIETY = 22002044 AND PLIEC1 = aivsweb.AIDPATT.DATTID) AND aivsweb.AIDPATT.DATTAC = 22002024 AND aivsweb.AIDPATT.DATTTY = 22002117 ORDER BY aivsweb.AIDPATT.DATTDE DESC, aivsweb.AIDPATT.DATTID DESC fetch first 1 row only
webai.db.req2=SELECT aivsweb.AIDPATT.DATTUT AS GEST FROM aivsweb.AIDPATT INNER JOIN aivsweb.AIDPDEM ON (aivsweb.AIDPDEM.DDEMID = aivsweb.AIDPATT.DDEMID) INNER JOIN aivsweb.AIDPGDE ON (aivsweb.AIDPGDE.DGDEID = aivsweb.AIDPDEM.DGDEID) INNER JOIN aivsweb.AISPDOS ON (aivsweb.AISPDOS.SDOSID = aivsweb.AIDPGDE.SDOSID) INNER JOIN aivsweb.TITIERP ON (aivsweb.TITIERP.HTITIE = aivsweb.AISPDOS.SDOSAS) INNER JOIN aivsweb.TIPERSP ON (aivsweb.TIPERSP.HTITIE = aivsweb.TITIERP.HTITIE) INNER JOIN aivsweb.TIPAVSP ON (aivsweb.TIPAVSP.HTITIE = aivsweb.TITIERP.HTITIE) WHERE aivsweb.TITIERP.HTPPHY = '1' AND aivsweb.TIPAVSP.HXNAVS like '#VALUE_TO_REPLACE#%' AND aivsweb.AIDPATT.DATTAC=22002024 AND aivsweb.AIDPATT.DATTTY=22000054 ORDER BY aivsweb.AIDPATT.DATTDE DESC, aivsweb.AIDPATT.DATTID DESC fetch first 1 row only
webai.db.req3=SELECT (CASE WHEN aivsweb.TITIERP.HTTLAN = 503001 THEN 'TEMP_FR' WHEN aivsweb.TITIERP.HTTLAN = 503002 THEN 'TEMP_DE' ELSE '' END) as GEST FROM aivsweb.AISPDOS INNER JOIN aivsweb.TITIERP ON (aivsweb.TITIERP.HTITIE = aivsweb.AISPDOS.SDOSAS) INNER JOIN aivsweb.TIPERSP ON (aivsweb.TIPERSP.HTITIE=aivsweb.TITIERP.HTITIE) INNER JOIN aivsweb.TIPAVSP ON (aivsweb.TIPAVSP.HTITIE=aivsweb.TITIERP.HTITIE) WHERE aivsweb.TITIERP.HTPPHY='1' AND aivsweb.TIPAVSP.HXNAVS like '#VALUE_TO_REPLACE#%'
