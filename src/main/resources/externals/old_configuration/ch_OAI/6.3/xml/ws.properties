webai.db.check=SELECT avs.hxnavs FROM aivsweb.jojpjou jou LEFT JOIN aivsweb.jojpgjo gjo ON gjo.jgjoid = jou.jgjoid INNER JOIN aivsweb.jojprep rep ON rep.jjouid = jou.jjouid AND rep.jrepty = '22002006' INNER JOIN aivsweb.jojpred red ON rep.jjouid = red.jjouid INNER JOIN aivsweb.enepenv env ON env.eenvid = red.jredir INNER JOIN aivsweb.eneppge pge ON env.eenvid = pge.eenvid INNER JOIN aivsweb.enepvpg vpg ON vpg.epgeid = pge.epgeid INNER JOIN aivsweb.aispdos dos ON dos.sdosid = Int(rep.jrepip) INNER JOIN aivsweb.titierp tie ON tie.htitie = dos.sdosas INNER JOIN aivsweb.tipavsp avs ON avs.htitie = tie.htitie WHERE  pge.epgens = 'GEDOCR' AND vpg.evpgva = '##num_ocr##'
webai.db.field=GEST
